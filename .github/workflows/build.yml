name: Build

on:
  push:
    branches: ['**']
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Windows, so the JavaFX tests have a desktop session to run in
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Test the plugin
        working-directory: bridge-plugin/com.ulanzi.deckbridge.ulanziPlugin
        run: |
          npm ci --no-audit --no-fund
          node --test test/
      - name: Test the Java modules
        timeout-minutes: 10
        run: mvn -B -ntp verify

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Check the tag matches pom.xml
        run: |
          revision=$(sed -n 's:.*<revision>\(.*\)</revision>.*:\1:p' pom.xml)
          if [ "v$revision" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match pom.xml revision $revision"
            exit 1
          fi
      - name: Package the plugin
        run: |
          bash scripts/package-plugin.sh "${GITHUB_REF_NAME#v}"
          cd dist
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
